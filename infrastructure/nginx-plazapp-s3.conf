# =============================================================================
# Plazapp · vhost de NGINX (host) para el subdominio de MinIO S3
# =============================================================================
# s3.paseovenecia.com.sv → S3 API expuesta en loopback (127.0.0.1:9000).
# Console (9001) NO se expone — se accede puntualmente por túnel SSH del
# operador (ver CLAUDE.md sección "MinIO Console — acceso de operador").
#
# ⚠️ PUNTO CRÍTICO DE SEGURIDAD DE FIRMAS:
# El backend firma las URLs pre-firmadas con el endpoint INTERNO
# (minio:9000), por lo que el canonical request de SigV4 incluye
# `host: minio:9000`. Si NGINX reenvía al upstream con un Host distinto
# (típico: $host o $proxy_host), MinIO rechaza la firma.
# Por eso este vhost fija `proxy_set_header Host minio:9000;` en el
# upstream — el navegador ve `s3.paseovenecia.com.sv` pero MinIO valida
# contra `minio:9000`.
#
# Instalación en la VPS:
#   sudo cp infrastructure/nginx-plazapp-s3.conf /etc/nginx/sites-available/plazapp-s3
#   (editá server_name con tu dominio real)
#   sudo ln -s /etc/nginx/sites-available/plazapp-s3 /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d s3.paseovenecia.com.sv
# =============================================================================

server {
    listen 80;
    listen [::]:80;
    server_name s3.paseovenecia.com.sv;

    # Límite de subida de adjuntos (25 MB/archivo, ver CLAUDE.md / S-TamañoMax).
    # MinIO y el NGINX deben coincidir — el backend usa 25M como tope duro.
    client_max_body_size 25M;

    # Buffers grandes para streaming de archivos (descargas de adjuntos).
    # Sin esto NGINX cachea el archivo entero en disco antes de enviarlo,
    # desperdiciando I/O en archivos de varios MB.
    proxy_buffering off;
    proxy_request_buffering off;

    # Proxy a MinIO en loopback. Lo CRÍTICO:
    #   - proxy_pass http://127.0.0.1:9000 → tráfico al contenedor por loopback
    #   - proxy_set_header Host minio:9000 → mantiene la firma SigV4 válida
    #     (el backend firmó con endPoint=minio, port=9000; MinIO debe
    #      reconstruir el canonical request con ese mismo host).
    #   - X-Forwarded-Proto https → para que MinIO genere redirects consistentes
    #     si alguna vez lo necesita.
    location / {
        proxy_pass http://127.0.0.1:9000;
        proxy_http_version 1.1;
        proxy_set_header Host              minio:9000;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Timeouts generosos para descargas de archivos grandes.
        proxy_connect_timeout 30s;
        proxy_send_timeout    120s;
        proxy_read_timeout    120s;
    }

    # Healthcheck sin tocar MinIO (responde NGINX). Útil para el smoke test.
    location = /healthz {
        access_log off;
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }
}
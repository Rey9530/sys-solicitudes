# =============================================================================
# Plazapp · vhost de NGINX (host) para el subdominio de staging
# =============================================================================
# El reverse proxy + TLS lo da el nginx del host (con certbot), no Caddy.
# Los contenedores se publican en 127.0.0.1 (loopback) desde docker-compose:
#   frontend → 127.0.0.1:3000   ·   backend → 127.0.0.1:4000
#
# Instalación en la VPS:
#   sudo cp infrastructure/nginx-plazapp.conf /etc/nginx/sites-available/plazapp
#   (editá server_name con tu dominio real)
#   sudo ln -s /etc/nginx/sites-available/plazapp /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d app.relex-dev.com   # emite el cert y agrega el 443
# =============================================================================

server {
    listen 80;
    listen [::]:80;
    server_name app.relex-dev.com;

    # Límite de subida de adjuntos (25 MB/archivo, ver CLAUDE.md / S-TamañoMax).
    client_max_body_size 25M;

    # ---- NestJS (rutas que NestJS realmente expone) ----
    # Controllers REST bajo /api/v1/ (setGlobalPrefix + enableVersioning en main.ts).
    # Importante: el bloque `location /api/v1/` va ANTES del catch-all `location /api/`
    # para que NGINX matchee por prefijo más largo y mande solo lo de NestJS al :4000.
    # El resto de `/api/*` (route handlers BFF de Next.js) cae al catch-all que va a :3000.
    location /api/v1/ {
        proxy_pass http://127.0.0.1:4000;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    # Swagger UI (SwaggerModule.setup('api/docs', ...) en main.ts).
    location /api/docs {
        proxy_pass http://127.0.0.1:4000;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Health check (app.getHttpAdapter().get('/api/ping', ...) en main.ts).
    location = /api/ping {
        proxy_pass http://127.0.0.1:4000;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ---- Resto de /api/* → Next.js (route handlers BFF) ----
    # Aplica a: /api/auth/[...nextauth] (NextAuth), /api/calendario/export.ics,
    # /api/reportes/export, /api/solicitudes/[id]/permiso-pdf, etc.
    # Sin este bloque, NGINX devuelve 404 (formato RFC 7807 de NestJS) en
    # cualquier ruta BFF de Next.js que pase por `/api/*`.
    location /api/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        "upgrade";
    }

    # Todo lo demás → frontend Next.js.
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        "upgrade";
    }
}

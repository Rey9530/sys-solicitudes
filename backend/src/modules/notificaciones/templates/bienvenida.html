{{> _header}}
<h2 style="margin:0 0 12px;font-size:18px;">Bienvenido a Plazapp</h2>
<p>Hola {{nombre}},</p>
<p>Tu cuenta para <strong>{{plaza.nombreComercial}}</strong> ya está activa. Ingresa con el email <strong>{{email}}</strong> y la contraseña que te compartieron.</p>
<p style="margin:20px 0;">
  <a href="{{loginUrl}}" style="display:inline-block;padding:10px 18px;background:{{plaza.colorPrimario}};color:#fff;text-decoration:none;border-radius:6px;">Ir a Plazapp</a>
</p>
<p style="color:#71717a;font-size:13px;">Te recomendamos cambiar tu contraseña después del primer inicio de sesión.</p>
{{> _footer}}

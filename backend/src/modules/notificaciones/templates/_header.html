<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <style>
      :root { --color-primario: {{plaza.colorPrimario}}; }
    </style>
  </head>
  <body style="margin:0;padding:0;background:#f4f4f5;font-family:-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif;">
    <div style="max-width:560px;margin:0 auto;padding:24px 16px;">
      <div style="background:{{plaza.colorPrimario}};border-radius:8px 8px 0 0;padding:16px 24px;display:flex;align-items:center;">
        {{#if plaza.logoUrl}}
        <img src="{{plaza.logoUrl}}" alt="{{plaza.nombreComercial}}" height="32" style="height:32px;vertical-align:middle;margin-right:12px;border:0;" />
        {{/if}}
        <span style="color:#ffffff;font-size:18px;font-weight:600;vertical-align:middle;">{{plaza.nombreComercial}}</span>
      </div>
      <div style="background:#ffffff;border-radius:0 0 8px 8px;padding:24px;color:#27272a;font-size:14px;line-height:1.6;">

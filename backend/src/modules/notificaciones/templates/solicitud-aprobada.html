{{> _header}}
<h2 style=”margin:0 0 12px;font-size:18px;color:#15803d;”>✓ Solicitud aprobada</h2>
<p>Tu solicitud <strong>{{solicitudCodigo}}</strong>{{#if solicitudTitulo}} — “{{solicitudTitulo}}”{{/if}} fue <strong>aprobada</strong>.</p>
{{> _solicitud-detalles}}
{{#if comentario}}
<div style=”border-left:4px solid #15803d;background:#f0fdf4;padding:10px 14px;margin:12px 0;border-radius:0 6px 6px 0;”>
  <p style=”margin:0;color:#166534;”>{{comentario}}</p>
</div>
{{/if}}
<p style=”margin:20px 0;”>
  <a href=”{{appUrl}}/inquilino/solicitudes” style=”display:inline-block;padding:10px 18px;background:{{plaza.colorPrimario}};color:#fff;text-decoration:none;border-radius:6px;”>Ver detalle</a>
</p>
{{> _footer}}

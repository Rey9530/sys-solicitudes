name: frontend_mobil
description: "Plazapp — App móvil de gestión de solicitudes para centros comerciales"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.11.5

# ─────────────────────────────────────────────────────────────────────────────
# Dependencias — verificadas en pub.dev (jul 2026).
# Filosofía: provider (NO BLoC/Riverpod/GetIt), dio + interceptor propio para JWT,
# flutter_secure_storage + shared_preferences para persistencia, sin ORMs locales
# (no hive/isar/drift), sin generación pesada (no freezed/retrofit).
# ─────────────────────────────────────────────────────────────────────────────
dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # UI / iconografía
  cupertino_icons: ^1.0.8
  lucide_icons: ^0.257.0           # mirror 1:1 de lucide-react del web

  # Estado
  provider: ^6.1.5                 # ChangeNotifier + Selector + Consumer

  # HTTP
  dio: ^5.11.0                     # Singleton con QueuedInterceptor para refresh JWT

  # Persistencia
  flutter_secure_storage: ^10.3.1  # JWT + plaza activa (Keychain/EncryptedSharedPrefs)
  shared_preferences: ^2.5.5       # Último tenant, tema, filtros cacheados

  # Routing
  go_router: ^17.3.0               # StatefulShellRoute.indexedStack para shells

  # Formularios (solo para formularios grandes: crear solicitud, perfil)
  flutter_form_builder: ^10.3.0
  form_builder_validators: ^11.3.0

  # Widgets del dominio
  table_calendar: ^3.2.0           # Mirror del FullCalendar del web
  fl_chart: ^1.2.0                 # Dashboard (barras / líneas / pie)

  # Archivos / cámara
  image_picker: ^1.2.3             # Fotos
  file_picker: ^11.0.2             # PDFs y documentos

  # Notificaciones push (Fase 2)
  firebase_messaging: ^16.4.3
  firebase_core: ^4.12.1

  # i18n / formato
  intl: ^0.20.2                    # DateFormat, NumberFormat, locale 'es' (pin por flutter_localizations)

  # Logging
  logger: ^2.7.0                   # Pretty console + opcional file

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.15.1            # Para json_serializable (cuando se use); 2.15.2 requiere meta incompatible con flutter_test
  json_serializable: ^6.14.0

flutter:
  uses-material-design: true

  # assets (vacío por ahora; los íconos/logos vendrán en Fase 4+)

  # Fuentes locales — replican la identidad visual del web
  fonts:
    - family: GeneralSans
      fonts:
        - asset: assets/fonts/GeneralSans-Regular.ttf
          weight: 400
        - asset: assets/fonts/GeneralSans-Medium.ttf
          weight: 500
        - asset: assets/fonts/GeneralSans-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/GeneralSans-Bold.ttf
          weight: 700
    - family: JetBrainsMono
      fonts:
        - asset: assets/fonts/JetBrainsMono-Regular.ttf
          weight: 400
        - asset: assets/fonts/JetBrainsMono-Medium.ttf
          weight: 500
        - asset: assets/fonts/JetBrainsMono-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/JetBrainsMono-Bold.ttf
          weight: 700
name: frontend_mobil
description: "Plazapp — app móvil (iOS/Android) del portal de solicitudes."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.13.7

# Solo paquetes oficiales (flutter.dev / dart.dev / tools.dart.dev) o de
# publisher verificado con alta adopción. Versión, publisher y motivo de cada
# uno en CHANGELOG.md. Regla del owner: nada desconocido ni abandonado.
dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # Estado
  flutter_riverpod: ^3.4.3
  # Navegación
  go_router: ^18.1.1
  # HTTP (multipart incluido) y MIME declarado de los adjuntos
  http: ^1.6.0
  http_parser: ^4.1.2
  mime: ^2.1.0
  # Persistencia: tokens cifrados y preferencias
  flutter_secure_storage: ^11.2.0
  shared_preferences: ^2.5.6
  # Formatos en español
  intl: ^0.20.3
  # Archivos, cámara, descargas
  file_picker: ^13.3.0
  image_picker: ^1.2.4
  path_provider: ^2.1.6
  share_plus: ^13.3.1
  url_launcher: ^6.3.3
  # Gráficas del dashboard
  fl_chart: ^1.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/plantillas/
